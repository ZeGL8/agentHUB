[project]
name = "agenthub"
version = "0.1.0"
description = "本地多 Agent 工具的统一会话索引与交接器"
requires-python = ">=3.9"
dependencies = [
    "zstandard>=0.25.0",
]

[project.scripts]
agenthub = "agenthub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenthub"]
